# Qwen3 0.6B base with LoRA adapters.
#
# Ungated, so a fresh clone can run it without accepting a licence, which is why the selection
# experiment uses this rather than the Gemma configs. It is also the base the parallel CPT
# selection project on the lab machine uses, so results from the two are comparable.
#
# 0.6B in fp32 is about 2.4 GB of weights. LoRA keeps the base frozen so only adapter parameters
# carry optimizer state, which is what makes this fit alongside the 5.5 GB an unrelated service
# holds on the lab GPU.
#
# The tradeoff to state in any write-up: a LoRA CPT run and a full finetune are not the same
# experiment. LoRA limits how much the model can absorb from the corpus, so a null result here
# does not establish that full CPT would also have been null.
name_or_path: Qwen/Qwen3-0.6B-Base
dtype: auto
gradient_checkpointing: true

use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
# Left null so PEFT picks the attention projections appropriate to the architecture.
lora_target_modules: null
