# Pipeline validation, not a result.
#
# Runs the entire CPT path - shard fetch, filtering, packing, training, checkpointing - on a
# laptop CPU in a few minutes with a 135M model and one shard. Its purpose is to fail loudly when
# someone breaks the pipeline, so run it before pushing.
#
#   uv run medsel train --config configs/experiment/smoke_cpu.yaml
#
# Nothing here is tuned for learning anything: 20 steps over ~500 documents teaches the model
# nothing useful, and the loss curve should not be interpreted.
name: smoke-cpu
stage: cpt
notes: CPU smoke test. Validates the pipeline end to end; produces no meaningful model.

model: ../model/smollm2_135m.yaml

data:
  source: pubmed
  split: train
  limit: 500
  loader:
    num_shards: 1
    min_chars: 200

train:
  output_dir: runs/smoke-cpu
  block_size: 256
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  max_steps: 20
  warmup_ratio: 0.0
  logging_steps: 5
  save_steps: 1000        # above max_steps, so only the final save fires
  seed: 42
  # A 500-document sample can pack into fewer than one full block at larger block sizes; keeping
  # the remainder guarantees the smoke test always has something to train on.
  drop_remainder: false
